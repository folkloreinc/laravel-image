version: 2
updates:
  # Updates are grouped into one pull request per ecosystem, so each week runs CI
  # once per ecosystem instead of once per dependency. Major Composer and npm
  # updates keep their own pull request.
  - package-ecosystem: github-actions
    directory: /
    target-branch: v1.x
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    target-branch: v1.x
    schedule:
      interval: weekly
    versioning-strategy: widen
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: v1.x
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Babel 8 can't be installed yet: @rollup/plugin-babel still requires
      # @babel/core ^7. Remove this once it accepts Babel 8, then upgrade
      # @babel/core and @babel/preset-env together (#37).
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
