version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: v1.x
    schedule:
      interval: weekly

  - package-ecosystem: composer
    directory: /
    target-branch: v1.x
    schedule:
      interval: weekly
    versioning-strategy: widen

  - package-ecosystem: npm
    directory: /
    target-branch: v1.x
    schedule:
      interval: weekly
    ignore:
      # Babel 8 can't be installed yet: @rollup/plugin-babel still requires
      # @babel/core ^7. Remove this once it accepts Babel 8, then upgrade
      # @babel/core and @babel/preset-env together (#37).
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
