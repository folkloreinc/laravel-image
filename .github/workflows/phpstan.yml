name: phpstan

on:
  push:
    # Pushes to v1.x run v1.x's own workflows.
    branches: [v2.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on v2.x all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Imagick and FFI, so Larastan knows the classes of every driver.
          extensions: gd, imagick, exif, fileinfo, ffi
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # Fails if a class doesn't match its PSR-4 path
      - name: Check the autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github
