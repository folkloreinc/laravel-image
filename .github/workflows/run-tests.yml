name: run-tests

on:
  push:
    branches: [v1.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Laravel 9 is still used by active projects (see AGENTS.md).
        laravel: ['9.*', '10.*', '11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - { laravel: '9.*', testbench: '7.*' }
          - { laravel: '10.*', testbench: '8.*' }
          - { laravel: '11.*', testbench: '9.*' }
          - { laravel: '12.*', testbench: '10.*' }
          - { laravel: '13.*', testbench: '11.*' }
        # PHP versions each Laravel version supports.
        exclude:
          - { laravel: '9.*', php: '8.4' }
          - { laravel: '9.*', php: '8.5' }
          - { laravel: '10.*', php: '8.4' }
          - { laravel: '10.*', php: '8.5' }
          - { laravel: '11.*', php: '8.5' }
          - { laravel: '13.*', php: '8.2' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick, exif, fileinfo
          coverage: none

      # Every Laravel 9–11 release has a security advisory, so recent Composer versions refuse to
      # install them. Active client projects still run these versions, so the suite must cover them.
      - name: Allow framework versions with security advisories
        run: |
          composer config --global policy.advisories.block false \
            || composer config --global audit.block-insecure false \
            || true

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed versions
        run: |
          for package in laravel/framework orchestra/testbench phpunit/phpunit; do
            composer show "$package" | grep -E '^(name |versions)'
          done

      - name: Run tests
        run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Coverage

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, exif, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --coverage-clover coverage/clover.xml --coverage-text --only-summary-for-coverage-text | tee coverage/summary.txt
          {
            echo '### Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/clover.xml

  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: S3-compatible disk

    steps:
      - uses: actions/checkout@v5

      # MinIO no longer publishes public Docker images, so CI uses moto's S3-compatible
      # server. The test only relies on the S3 API, so it also runs against MinIO locally.
      - name: Start an S3-compatible server (moto)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.3"
          "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/moto.log"
          exit 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, exif, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run the S3 disk tests
        env:
          IMAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        # Fail instead of silently skipping if the server is unreachable.
        run: vendor/bin/phpunit tests/Feature/S3DiskTest.php --fail-on-skipped
