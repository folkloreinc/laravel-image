name: run-tests

on:
  push:
    # Pushes to v1.x run v1.x's own workflows.
    branches: [v2.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on v2.x all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that change no file the PHP suite depends on (docs, for example)
  # skip the test jobs. Pushes and manual runs always run them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Changes
    outputs:
      php: ${{ steps.affected.outputs.php }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find the suites the changes affect
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            # The checkout is the merge commit, whose first parent is the base branch.
            git diff --name-only HEAD^1 HEAD | .github/scripts/affected-suites.sh | tee -a "$GITHUB_OUTPUT"
          else
            echo php=true | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        # The Intervention drivers (docs/decisions/0002-rendering-engine.md).
        driver: [gd, imagick, vips]
        stability: [prefer-stable]
        include:
          - { laravel: '12.*', testbench: '10.*' }
          - { laravel: '13.*', testbench: '11.*' }
          # The lowest dependencies, once per Laravel version, on its lowest PHP version:
          # that's where the declared minimums break. On newer PHP versions, Composer
          # already skips the dependency versions they don't support.
          - { php: '8.3', laravel: '12.*', testbench: '10.*', driver: gd, stability: prefer-lowest }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', driver: gd, stability: prefer-lowest }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.driver }} - ${{ matrix.stability }}

    env:
      # The driver the image tests use. They fail, instead of skipping, if it isn't available.
      IMAGE_TEST_DRIVER: ${{ matrix.driver }}

    steps:
      - uses: actions/checkout@v7

      # The vips driver loads libvips through FFI (jcupitt/vips).
      - name: Install libvips
        if: matrix.driver == 'vips'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools libheif-plugin-libde265
          vips --version

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # ffi is needed by every job to install jcupitt/vips, a development dependency.
          extensions: gd, exif, fileinfo, ffi${{ matrix.driver == 'imagick' && ', imagick' || '' }}
          # PHP-FPM needs ffi.enable=true for libvips; the CLI's default (preload) would
          # be enough here, but CI runs what production needs.
          ini-values: ffi.enable=${{ matrix.driver == 'vips' && 'true' || 'preload' }}
          coverage: none

      # HEIC sources need libheif's HEVC decoder, which Ubuntu ships as a plugin. The
      # Imagick jobs check it works, so the HEIC tests can't silently skip there.
      - name: Install the HEIC decoder
        if: matrix.driver == 'imagick'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-plugin-libde265
          php -r 'new Imagick("tests/fixtures/images/heic/photo.heic"); echo "Imagick reads HEIC\n";'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed versions
        run: |
          for package in laravel/framework orchestra/testbench phpunit/phpunit intervention/image; do
            composer show "$package" | grep -E '^(name |versions)'
          done

      - name: Run tests
        run: vendor/bin/phpunit

  coverage:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Coverage

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, exif, fileinfo, ffi
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --coverage-clover coverage/clover.xml --coverage-text --only-summary-for-coverage-text | tee coverage/summary.txt
          {
            echo '### Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/clover.xml

  # A single, stable check to require in branch protection, instead of every matrix job.
  # The test jobs either all succeed, or were all skipped because the PHP suite isn't affected.
  tests-passed:
    if: always()
    needs: [changes, test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Tests passed

    steps:
      - name: Check that every test job succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          PHP: ${{ needs.changes.outputs.php }}
          TEST: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          echo "changes: $CHANGES (php: $PHP)"
          echo "test: $TEST"
          echo "coverage: $COVERAGE"
          test "$CHANGES" = success
          if [ "$PHP" = true ]; then expected=success; else expected=skipped; fi
          for result in "$TEST" "$COVERAGE"; do
            test "$result" = "$expected"
          done
