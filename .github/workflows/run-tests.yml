name: run-tests

on:
  push:
    branches: [v1.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on v1.x all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that change no file the PHP suite depends on (docs, the JS package)
  # skip the test jobs. Pushes and manual runs always run them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Changes
    outputs:
      php: ${{ steps.affected.outputs.php }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find the suites the changes affect
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            # The checkout is the merge commit, whose first parent is the base branch.
            git diff --name-only HEAD^1 HEAD | .github/scripts/affected-suites.sh | tee -a "$GITHUB_OUTPUT"
          else
            echo php=true | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Laravel 9 is still used by active projects (see AGENTS.md).
        laravel: ['9.*', '10.*', '11.*', '12.*', '13.*']
        stability: [prefer-stable]
        include:
          - { laravel: '9.*', testbench: '7.*' }
          - { laravel: '10.*', testbench: '8.*' }
          - { laravel: '11.*', testbench: '9.*' }
          - { laravel: '12.*', testbench: '10.*' }
          - { laravel: '13.*', testbench: '11.*' }
          # The lowest dependencies, once per Laravel version, on its lowest PHP version:
          # that's where the declared minimums break. On newer PHP versions, Composer
          # already skips the dependency versions they don't support.
          - { php: '8.2', laravel: '9.*', testbench: '7.*', stability: prefer-lowest }
          - { php: '8.2', laravel: '10.*', testbench: '8.*', stability: prefer-lowest }
          - { php: '8.2', laravel: '11.*', testbench: '9.*', stability: prefer-lowest }
          - { php: '8.2', laravel: '12.*', testbench: '10.*', stability: prefer-lowest }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', stability: prefer-lowest }
        # PHP versions each Laravel version supports.
        exclude:
          - { laravel: '9.*', php: '8.4' }
          - { laravel: '9.*', php: '8.5' }
          - { laravel: '10.*', php: '8.4' }
          - { laravel: '10.*', php: '8.5' }
          - { laravel: '11.*', php: '8.5' }
          - { laravel: '13.*', php: '8.2' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick, exif, fileinfo
          coverage: none

      # Every Laravel 9–11 release has a security advisory, so recent Composer versions refuse to
      # install them. Active client projects still run these versions, so the suite must cover them.
      - name: Allow framework versions with security advisories
        run: |
          composer config --global policy.advisories.block false \
            || composer config --global audit.block-insecure false \
            || true

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed versions
        run: |
          for package in laravel/framework orchestra/testbench phpunit/phpunit; do
            composer show "$package" | grep -E '^(name |versions)'
          done

      - name: Run tests
        run: vendor/bin/phpunit

  coverage:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Coverage

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, exif, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The HEIC tests need libheif's HEVC decoder, which Ubuntu ships as a plugin.
      # This job checks it works, so they don't silently skip everywhere.
      - name: Install the HEIC decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-plugin-libde265
          php -r 'new Imagick("tests/fixture/heic/photo.heic"); echo "Imagick reads HEIC\n";'

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --coverage-clover coverage/clover.xml --coverage-text --only-summary-for-coverage-text | tee coverage/summary.txt
          {
            echo '### Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/clover.xml

  s3:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: S3-compatible disk

    steps:
      - uses: actions/checkout@v7

      # MinIO no longer publishes public Docker images, so CI uses moto's S3-compatible
      # server. The test only relies on the S3 API, so it also runs against MinIO locally.
      - name: Start an S3-compatible server (moto)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.3"
          "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/moto.log"
          exit 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, exif, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run the S3 disk tests
        env:
          IMAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        # Fail instead of silently skipping if the server is unreachable.
        run: vendor/bin/phpunit tests/Feature/S3DiskTest.php --fail-on-skipped

  # A single, stable check to require in branch protection, instead of every matrix job.
  # The test jobs either all succeed, or were all skipped because the PHP suite isn't affected.
  tests-passed:
    if: always()
    needs: [changes, test, coverage, s3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Tests passed

    steps:
      - name: Check that every test job succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          PHP: ${{ needs.changes.outputs.php }}
          TEST: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
          S3: ${{ needs.s3.result }}
        run: |
          echo "changes: $CHANGES (php: $PHP)"
          echo "test: $TEST"
          echo "coverage: $COVERAGE"
          echo "s3: $S3"
          test "$CHANGES" = success
          if [ "$PHP" = true ]; then expected=success; else expected=skipped; fi
          for result in "$TEST" "$COVERAGE" "$S3"; do
            test "$result" = "$expected"
          done
